<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מרכז המשחקים ודפי העבודה שלי</title>
    <style>
        body {
            font-family: Narkisim, sans-serif;
            text-align: right;
            background-color: #f4f4f9;
            padding: 30px;
        }
        h1 { color: #333; }
        .container {
            display: flex;
            justify-content: right;
            gap: 10px;
            margin-top: 20px;
        }
        .card {
            background: #B7DFEB;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            width: 300px;
            transition: 0.2s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
    </style>
</head>
<body>

    <h1>ברוכים הבאים למרכז הלמידה שלי! 🌟</h1>
    <p>כאן תוכלו למצוא את כל המשחקים ודפי העבודה שיצרתי.</p>

    <div class="container">
        <!-- קישור למשחק הראשון שלך -->
        <a href="https://yaelziv13.github.io/My-edu-games/game1/" class="card">
            <h3>משחק 1: מאדים - סדר פעולות חשבון לכיתה ז</h3>
            <p>לחצו כאן כדי להתחיל לשחק!</p>
        </a>

        <!-- בעתיד תוכלי פשוט להעתיק את השורות האלו ולהוסיף עוד משחקים:
        <a href="./game2/" class="card">
            <h3>🧩 משחק מספר 2</h3>
            <p>תיאור קצר של המשחק</p>
        </a> 
        -->
    </div>

</body>
</html>
